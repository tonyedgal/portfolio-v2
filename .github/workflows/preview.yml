name: Worker preview

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: worker-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Build and upload preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://tony.spaceman.sh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a changeset
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/main

      - name: Build Worker
        run: pnpm build:worker

      - name: Upload preview version
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number || github.run_number }}
        run: |
          upload_log="$RUNNER_TEMP/wrangler-upload.log"

          pnpm exec wrangler versions upload \
            --preview-alias "$PREVIEW_ALIAS" \
            --message "${GITHUB_SHA}" | tee "$upload_log"

          preview_url="$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' "$upload_log" | tail -1)"

          if [ -z "$preview_url" ]; then
            echo "Wrangler did not report a preview URL." >&2
            exit 1
          fi

          echo "### Worker preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[$preview_url]($preview_url)" >> "$GITHUB_STEP_SUMMARY"
